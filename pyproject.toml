[project]
name = "contextcore-mcp"
version = "1.0.0"
description = "Universal SDLC-aware Code Intelligence & RAG engine over Qdrant and FastMCP for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "rag",
    "vector-database",
    "qdrant",
    "code-search",
    "ast",
    "fastmcp",
    "ai-agents",
    "claude",
    "codex",
    "tree-sitter",
    "embeddings",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "qdrant-client>=1.12,<2",
    "sentence-transformers>=3.3,<4",
    "tree-sitter>=0.21,<0.22",
    "tree-sitter-languages>=1.10,<2",
    "mcp[cli]>=1.5,<1.6",
    "pydantic>=2.10,<2.14",
    "uvicorn>=0.32,<1",
    "starlette>=0.41,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "prometheus-client>=0.20,<1",
]

[project.scripts]
ingest = "ingest:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning:tree_sitter",
    "ignore::DeprecationWarning:huggingface_hub",
]

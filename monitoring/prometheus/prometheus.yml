global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Scrape FastMCP server metrics
  - job_name: "contextcore-mcp"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["mcp_server:8000"]
        labels:
          service: "contextcore-mcp"

  # Scrape Qdrant native vector database metrics
  - job_name: "qdrant"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["qdrant:6333"]
        labels:
          service: "qdrant"
